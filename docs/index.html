<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>这世界，我来过</title>
  <meta name="theme-color" content="#0A0A0A">
  <link rel="manifest" href="/manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0A0A0A;
      --bg-elevated: #141414;
      --text: #F5F0EB;
      --text-secondary: #9B9490;
      --text-dim: #6B6560;
      --accent: #c9956b;
      --accent-light: #d4a574;
      --accent-glow: rgba(201, 149, 107, 0.15);
      --card-bg: rgba(255,255,255,0.04);
      --card-border: rgba(255,255,255,0.06);
      --nav-bg-start: rgba(10,10,10,0.98);
      --nav-bg-mid: rgba(10,10,10,0.8);
      --ambient-1: rgba(201,149,107,0.12);
      --ambient-2: rgba(201,149,107,0.08);
      --serif: 'Noto Serif SC', 'Songti SC', serif;
      --sans: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    [data-theme="light"] {
      --bg: #FAFAF8;
      --bg-elevated: #F0EDE8;
      --text: #2C2825;
      --text-secondary: #6B6560;
      --text-dim: #9B9490;
      --accent: #a07040;
      --accent-light: #b8844e;
      --accent-glow: rgba(160, 112, 64, 0.1);
      --card-bg: rgba(0,0,0,0.03);
      --card-border: rgba(0,0,0,0.08);
      --nav-bg-start: rgba(250,250,248,0.98);
      --nav-bg-mid: rgba(250,250,248,0.8);
      --ambient-1: rgba(201,149,107,0.08);
      --ambient-2: rgba(201,149,107,0.05);
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      transition: background 0.4s ease, color 0.3s ease;
    }

    .ambient {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .ambient::before,
    .ambient::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.4;
      animation: drift 20s ease-in-out infinite;
    }

    .ambient::before {
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, var(--ambient-1), transparent 70%);
      top: -200px;
      right: -200px;
    }

    .ambient::after {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, var(--ambient-2), transparent 70%);
      bottom: -150px;
      left: -150px;
      animation-delay: -10s;
    }

    @keyframes drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -20px) scale(1.05); }
      66% { transform: translate(-20px, 15px) scale(0.95); }
    }

    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: linear-gradient(to bottom, var(--nav-bg-start) 0%, var(--nav-bg-mid) 70%, transparent 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .nav-logo {
      font-family: var(--serif);
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--accent-light);
      cursor: pointer;
      transition: opacity 0.3s;
    }

    .nav-logo:hover { opacity: 0.8; }

    .nav-actions { display: flex; gap: 8px; }

    .nav-btn {
      padding: 10px 20px;
      border: 1px solid var(--card-border);
      background: rgba(255,255,255,0.03);
      color: var(--text-secondary);
      border-radius: 100px;
      font-size: 0.85rem;
      font-family: var(--sans);
      font-weight: 400;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 0.02em;
    }

    .nav-btn:hover {
      background: rgba(255,255,255,0.08);
      color: var(--text);
      border-color: rgba(255,255,255,0.12);
    }

    [data-theme="light"] .nav-btn:hover {
      background: rgba(0,0,0,0.05);
      border-color: rgba(0,0,0,0.12);
    }

    .nav-btn.primary {
      background: var(--accent);
      color: #0A0A0A;
      border-color: var(--accent);
      font-weight: 500;
    }

    .nav-btn.primary:hover {
      background: var(--accent-light);
      border-color: var(--accent-light);
    }

    .theme-toggle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-secondary);
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 4px;
      flex-shrink: 0;
    }

    .theme-toggle:hover {
      background: rgba(255,255,255,0.08);
      color: var(--text);
    }

    [data-theme="light"] .theme-toggle:hover {
      background: rgba(0,0,0,0.06);
    }

    .main {
      min-height: 100vh;
      position: relative;
      z-index: 1;
    }

    .story-view {
      position: relative;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 120px 40px 140px;
    }

    .story-card {
      max-width: 680px;
      width: 100%;
      position: relative;
    }

    .story-card::before {
      content: '';
      position: absolute;
      top: -40px;
      left: 0;
      width: 60px;
      height: 2px;
      background: var(--accent);
      opacity: 0.6;
    }

    .story-age {
      display: inline-block;
      font-family: var(--sans);
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      color: var(--accent);
      margin-bottom: 32px;
      padding: 6px 16px;
      border: 1px solid rgba(201,149,107,0.3);
      border-radius: 100px;
    }

    .story-message {
      font-family: var(--serif);
      font-size: 1.6rem;
      font-weight: 400;
      line-height: 2;
      color: var(--text);
      margin-bottom: 48px;
      letter-spacing: 0.02em;
      white-space: pre-wrap;
    }

    .story-message::first-letter {
      font-size: 2.2rem;
      color: var(--accent-light);
      font-weight: 600;
    }

    .story-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      padding-top: 24px;
      border-top: 1px solid var(--card-border);
    }

    .story-user {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: opacity 0.3s;
    }

    .story-user:hover { opacity: 0.7; }

    .story-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--serif);
      font-weight: 600;
      font-size: 0.85rem;
      color: #0A0A0A;
    }

    .story-username {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text);
    }

    .story-date {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-left: auto;
    }

    .story-nav {
      position: fixed;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 24px;
      z-index: 50;
    }

    .story-nav-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid var(--card-border);
      background: var(--bg-elevated);
      color: var(--text-secondary);
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.3s;
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .story-nav-btn:hover {
      background: rgba(255,255,255,0.08);
      color: var(--text);
      border-color: rgba(255,255,255,0.15);
    }

    [data-theme="light"] .story-nav-btn:hover {
      background: rgba(0,0,0,0.06);
      border-color: rgba(0,0,0,0.15);
    }

    .story-counter {
      font-size: 0.75rem;
      color: var(--text-dim);
      letter-spacing: 0.2em;
      font-weight: 300;
    }

    .page-indicator {
      position: fixed;
      right: 40px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 50;
    }

    .page-dot {
      width: 3px;
      height: 20px;
      border-radius: 2px;
      background: rgba(255,255,255,0.1);
      transition: all 0.3s;
      cursor: pointer;
    }

    .page-dot.active {
      height: 40px;
      background: var(--accent);
    }

    .home-hint {
      position: fixed;
      bottom: 110px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      color: var(--text-dim);
      letter-spacing: 0.15em;
      font-weight: 300;
      z-index: 10;
      opacity: 0.6;
    }

    /* Profile */
    .profile-view {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 200;
      padding: 100px 40px 60px;
      overflow-y: auto;
    }

    .profile-view.active { display: block; }

    .profile-header {
      max-width: 720px;
      margin: 0 auto 64px;
      text-align: center;
    }

    .profile-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--serif);
      font-size: 2rem;
      font-weight: 600;
      color: #0A0A0A;
      margin: 0 auto 20px;
    }

    .profile-name {
      font-family: var(--serif);
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: 0.05em;
    }

    .profile-bio {
      color: var(--text-dim);
      font-size: 0.95rem;
      font-weight: 300;
      margin-bottom: 32px;
    }

    .profile-stats {
      display: flex;
      justify-content: center;
      gap: 40px;
      padding: 20px 0;
      border-top: 1px solid var(--card-border);
      border-bottom: 1px solid var(--card-border);
    }

    .profile-stat { text-align: center; }

    .profile-stat-num {
      font-family: var(--serif);
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--accent);
    }

    .profile-stat-label {
      font-size: 0.75rem;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      margin-top: 4px;
    }

    .profile-timeline {
      max-width: 720px;
      margin: 0 auto;
      position: relative;
    }

    .profile-timeline::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 1px;
      background: linear-gradient(to bottom, transparent, var(--card-border) 10%, var(--card-border) 90%, transparent);
    }

    .timeline-item {
      padding-left: 40px;
      margin-bottom: 48px;
      position: relative;
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      left: -4px;
      top: 8px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg);
    }

    .timeline-year {
      font-family: var(--sans);
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      color: var(--text-dim);
      margin-bottom: 8px;
    }

    .timeline-age {
      font-family: var(--serif);
      font-size: 0.9rem;
      color: var(--accent);
      margin-bottom: 12px;
      font-weight: 400;
    }

    .timeline-message {
      font-family: var(--serif);
      font-size: 1.1rem;
      line-height: 1.9;
      color: var(--text);
      font-weight: 400;
    }

    /* Year Explorer */
    .year-explorer {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 200;
      padding: 100px 40px 60px;
      overflow-y: auto;
    }

    .year-explorer.active { display: block; }

    .year-header {
      max-width: 1000px;
      margin: 0 auto 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .year-title {
      font-family: var(--serif);
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .year-grid {
      max-width: 1000px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 12px;
    }

    .year-card {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      font-family: var(--serif);
      font-size: 1.3rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      gap: 6px;
      color: var(--text-secondary);
    }

    .year-card:hover {
      background: rgba(255,255,255,0.06);
      border-color: rgba(201,149,107,0.3);
      color: var(--text);
      transform: translateY(-2px);
    }

    [data-theme="light"] .year-card:hover {
      background: rgba(0,0,0,0.04);
    }

    .year-card.has-content {
      background: var(--accent-glow);
      border-color: rgba(201,149,107,0.4);
      color: var(--accent-light);
    }

    .year-card .count {
      font-family: var(--sans);
      font-size: 0.7rem;
      color: var(--text-dim);
      font-weight: 300;
      letter-spacing: 0.05em;
    }

    .year-card.has-content .count { color: var(--accent); }

    .year-stories {
      display: none;
      max-width: 720px;
      margin: 0 auto;
    }

    .year-stories.active { display: block; }

    .year-story-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 28px 32px;
      border-radius: 16px;
      margin-bottom: 16px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .year-story-card:hover {
      background: rgba(255,255,255,0.06);
      border-color: rgba(201,149,107,0.2);
      transform: translateY(-1px);
    }

    [data-theme="light"] .year-story-card:hover {
      background: rgba(0,0,0,0.04);
    }

    .year-story-user {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .year-story-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--serif);
      font-weight: 600;
      font-size: 0.75rem;
      color: #0A0A0A;
    }

    .year-story-name {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text);
    }

    .year-story-age {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-left: auto;
    }

    .year-story-message {
      font-family: var(--serif);
      font-size: 1rem;
      line-height: 1.8;
      color: var(--text-secondary);
    }

    /* Write */
    .write-view {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 200;
      padding: 100px 40px 60px;
      overflow-y: auto;
    }

    .write-view.active { display: block; }

    .write-container { max-width: 640px; margin: 0 auto; }

    .write-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 56px;
    }

    .write-title {
      font-family: var(--serif);
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .write-step { margin-bottom: 36px; }

    .write-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      margin-bottom: 12px;
    }

    .write-input {
      width: 100%;
      padding: 16px 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text);
      font-size: 1rem;
      font-family: var(--sans);
      font-weight: 300;
      transition: all 0.3s;
    }

    .write-input:focus {
      outline: none;
      border-color: rgba(201,149,107,0.4);
      background: var(--bg-elevated);
    }

    .write-input::placeholder { color: var(--text-dim); }

    .write-textarea {
      min-height: 280px;
      resize: vertical;
      line-height: 2;
      font-family: var(--serif);
      font-size: 1.1rem;
      letter-spacing: 0.02em;
    }

    .write-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .write-actions { display: flex; gap: 12px; margin-top: 40px; }

    .write-btn {
      flex: 1;
      padding: 16px 24px;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      font-size: 0.9rem;
      font-family: var(--sans);
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 0.05em;
    }

    .write-btn.secondary {
      background: transparent;
      color: var(--text-secondary);
    }

    .write-btn.secondary:hover {
      background: rgba(255,255,255,0.05);
      color: var(--text);
    }

    .write-btn.primary {
      background: var(--accent);
      color: #0A0A0A;
      border-color: var(--accent);
    }

    .write-btn.primary:hover {
      background: var(--accent-light);
      border-color: var(--accent-light);
    }

    /* Preview */
    .preview-view {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 250;
      padding: 100px 40px 60px;
      overflow-y: auto;
    }

    .preview-view.active { display: block; }

    .preview-container { max-width: 640px; margin: 0 auto; }

    .preview-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 48px;
      margin-bottom: 24px;
      position: relative;
    }

    .preview-card::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 40px;
      right: 40px;
      height: 2px;
      background: linear-gradient(to right, transparent, var(--accent), transparent);
      border-radius: 2px;
    }

    .preview-age {
      display: inline-block;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      color: var(--accent);
      margin-bottom: 24px;
      padding: 4px 14px;
      border: 1px solid rgba(201,149,107,0.3);
      border-radius: 100px;
    }

    .preview-message {
      font-family: var(--serif);
      font-size: 1.3rem;
      line-height: 2;
      color: var(--text);
      white-space: pre-wrap;
    }

    .preview-warning {
      background: rgba(201,149,107,0.08);
      border: 1px solid rgba(201,149,107,0.2);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 24px;
      color: var(--accent);
      font-size: 0.85rem;
      line-height: 1.6;
    }

    /* Search */
    .search-view {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 200;
      padding: 100px 40px 60px;
      overflow-y: auto;
    }

    .search-view.active { display: block; }

    .search-container { max-width: 560px; margin: 0 auto; }

    .search-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .search-title {
      font-family: var(--serif);
      font-size: 1.6rem;
      font-weight: 600;
    }

    .search-input {
      width: 100%;
      padding: 16px 24px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 100px;
      color: var(--text);
      font-size: 1rem;
      font-family: var(--sans);
      font-weight: 300;
      margin-bottom: 32px;
      transition: all 0.3s;
    }

    .search-input:focus {
      outline: none;
      border-color: rgba(201,149,107,0.4);
    }

    .search-input::placeholder { color: var(--text-dim); }

    .search-results { display: flex; flex-direction: column; gap: 12px; }

    .search-result-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 24px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .search-result-item:hover {
      background: rgba(255,255,255,0.06);
      border-color: rgba(201,149,107,0.2);
    }

    [data-theme="light"] .search-result-item:hover {
      background: rgba(0,0,0,0.04);
    }

    .search-result-name { font-weight: 500; font-size: 0.95rem; }
    .search-result-bio { font-size: 0.8rem; color: var(--text-dim); margin-top: 2px; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-elevated);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      padding: 14px 28px;
      border-radius: 100px;
      font-size: 0.85rem;
      color: var(--text);
      z-index: 300;
      animation: toastIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      letter-spacing: 0.03em;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translate(-50%, 16px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .nav { padding: 16px 20px; }
      .nav-logo { font-size: 1rem; }
      .nav-btn { padding: 8px 14px; font-size: 0.8rem; }
      .story-view { padding: 100px 24px 140px; }
      .story-message { font-size: 1.3rem; line-height: 1.9; }
      .story-card::before { width: 40px; }
      .story-nav { bottom: 32px; }
      .page-indicator { right: 16px; }
      .home-hint { bottom: 90px; }
      .profile-view, .year-explorer, .write-view, .preview-view, .search-view {
        padding: 80px 20px 40px;
      }
      .profile-name { font-size: 1.4rem; }
      .profile-stats { gap: 24px; }
      .year-title, .write-title, .search-title { font-size: 1.3rem; }
      .year-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
      .preview-card { padding: 32px 24px; }
      .preview-message { font-size: 1.1rem; }
      .write-row { grid-template-columns: 1fr; }
      .write-textarea { min-height: 220px; }
    }

    @media (max-width: 480px) {
      .story-message { font-size: 1.15rem; }
      .year-grid { grid-template-columns: repeat(3, 1fr); }
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
  </style>
</head>
<body>
  <div class="ambient"></div>

  <nav class="nav">
    <div class="nav-logo" onclick="showHome()">这世界，我来过</div>
    <div class="nav-actions">
      <button class="nav-btn" onclick="showSearch()">搜索</button>
      <button class="nav-btn" onclick="showYears()">年份</button>
      <button class="nav-btn primary" onclick="showWrite()">写一笔</button>
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切换主题">☀</button>
    </div>
  </nav>

  <main class="main" id="homeView">
    <div class="story-view" id="storyView">
      <div class="story-card">
        <span class="story-age" id="storyAge">25岁 · 2018</span>
        <p class="story-message" id="storyMessage"></p>
        <div class="story-meta">
          <div class="story-user" onclick="showProfile(currentStoryUser)">
            <div class="story-avatar" id="storyAvatar"></div>
            <span class="story-username" id="storyUser"></span>
          </div>
          <span class="story-date" id="storyDate"></span>
        </div>
      </div>
    </div>

    <div class="home-hint">← 翻阅故事 →</div>

    <div class="story-nav">
      <button class="story-nav-btn" onclick="prevStory()">←</button>
      <span class="story-counter" id="storyCounter"></span>
      <button class="story-nav-btn" onclick="nextStory()">→</button>
    </div>

    <div class="page-indicator" id="pageIndicator"></div>
  </main>

  <div class="profile-view" id="profileView">
    <div class="profile-header">
      <div class="profile-avatar" id="profileAvatar"></div>
      <h1 class="profile-name" id="profileName"></h1>
      <p class="profile-bio" id="profileBio"></p>
      <div class="profile-stats">
        <div class="profile-stat">
          <div class="profile-stat-num" id="profileStatYears">0</div>
          <div class="profile-stat-label">年份记录</div>
        </div>
        <div class="profile-stat">
          <div class="profile-stat-num" id="profileStatSpan">0</div>
          <div class="profile-stat-label">时间跨度</div>
        </div>
      </div>
    </div>
    <div class="profile-timeline" id="profileTimeline"></div>
    <div style="text-align:center; margin-top:20px;">
      <button class="nav-btn" onclick="hideProfile()">返回首页</button>
    </div>
  </div>

  <div class="year-explorer" id="yearExplorer">
    <div class="year-header">
      <h2 class="year-title">按年份浏览</h2>
      <button class="nav-btn" onclick="hideYears()">返回</button>
    </div>
    <div class="year-grid" id="yearGrid"></div>
    <div class="year-stories" id="yearStories"></div>
  </div>

  <div class="write-view" id="writeView">
    <div class="write-container">
      <div class="write-header">
        <h2 class="write-title">留下痕迹</h2>
        <button class="nav-btn" onclick="hideWrite()">返回</button>
      </div>
      <div class="write-row">
        <div class="write-step">
          <label class="write-label">那年你几岁</label>
          <input type="number" class="write-input" id="writeAge" placeholder="例如 25">
        </div>
        <div class="write-step">
          <label class="write-label">哪一年</label>
          <input type="number" class="write-input" id="writeYear" placeholder="例如 2018">
        </div>
      </div>
      <div class="write-step">
        <label class="write-label">写点什么 — 可以很长，可以很短</label>
        <textarea class="write-input write-textarea" id="writeMessage" placeholder="那年发生了什么？你在想什么？&#10;&#10;想写多少就写多少..."></textarea>
      </div>
      <div class="write-actions">
        <button class="write-btn secondary" onclick="hideWrite()">取消</button>
        <button class="write-btn primary" onclick="previewWrite()">预览</button>
      </div>
    </div>
  </div>

  <div class="preview-view" id="previewView">
    <div class="preview-container">
      <div class="write-header">
        <h2 class="write-title">确认发布</h2>
        <button class="nav-btn" onclick="hidePreview()">返回编辑</button>
      </div>
      <div class="preview-card">
        <span class="preview-age" id="previewAge"></span>
        <p class="preview-message" id="previewMessage"></p>
      </div>
      <div class="preview-warning">
        发布后不可修改、不可删除。这是你留给世界的痕迹，请确认内容。
      </div>
      <div class="write-actions">
        <button class="write-btn secondary" onclick="hidePreview()">返回编辑</button>
        <button class="write-btn primary" onclick="confirmPublish()">确认发布</button>
      </div>
    </div>
  </div>

  <div class="search-view" id="searchView">
    <div class="search-container">
      <div class="search-header">
        <h2 class="search-title">搜索</h2>
        <button class="nav-btn" onclick="hideSearch()">返回</button>
      </div>
      <input type="text" class="search-input" id="searchInput" placeholder="搜索用户名..." oninput="handleSearch()">
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>

  <script>
    // Theme toggle
    function initTheme() {
      var saved = localStorage.getItem('theme');
      if (saved === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
        document.getElementById('themeToggle').textContent = '☾';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#FAFAF8');
      }
    }

    function toggleTheme() {
      var html = document.documentElement;
      var btn = document.getElementById('themeToggle');
      var meta = document.querySelector('meta[name="theme-color"]');
      if (html.getAttribute('data-theme') === 'light') {
        html.removeAttribute('data-theme');
        btn.textContent = '☀';
        meta.setAttribute('content', '#0A0A0A');
        localStorage.setItem('theme', 'dark');
      } else {
        html.setAttribute('data-theme', 'light');
        btn.textContent = '☾';
        meta.setAttribute('content', '#FAFAF8');
        localStorage.setItem('theme', 'light');
      }
    }

    initTheme();

    const users = {
      '小明': {
        bio: '普通上班族，喜欢记录生活',
        entries: [
          { age: 22, year: 2015, message: '大学毕业了。四年过得真快，好像昨天才刚拖着行李箱走进校园。室友一个个搬走，宿舍空荡荡的。我最后一个离开，回头看了一眼住了四年的地方，心里说：再见了。', date: '2024年1月' },
          { age: 25, year: 2018, message: '第一份工作，第一个月工资，给妈妈买了一条围巾。她笑了，我也笑了。', date: '2024年2月' },
          { age: 28, year: 2021, message: '升职了。虽然加班很多，但看到成果的时候觉得值得。那天晚上一个人去了公司天台，看着城市的灯火，突然觉得自己在这一盏盏灯里，有了一盏属于自己的。', date: '2024年3月' },
          { age: 30, year: 2023, message: '三十岁了。没有立起来，但学会了接受自己的普通。', date: '2024年3月' }
        ]
      },
      '阿花': {
        bio: '摄影师，用镜头记录世界',
        entries: [
          { age: 18, year: 2008, message: '高考结束，感觉整个世界都在向我招手。那个夏天，阳光很烈，未来很远。', date: '2024年1月' },
          { age: 22, year: 2012, message: '买了第一台相机，开始学摄影。世界突然变得不一样了，每个角落都有故事。', date: '2024年2月' },
          { age: 26, year: 2016, message: '第一次办个人影展。来了很多人，有人哭了。那一刻觉得，摄影真的能传递情感。', date: '2024年2月' },
          { age: 30, year: 2020, message: '疫情那年，没法出门拍照。在家整理了以前的照片，发现时间过得真快。每一张照片都是一个被定格的瞬间，而那些瞬间，再也回不去了。', date: '2024年3月' }
        ]
      },
      '老王': {
        bio: '程序员，两个孩子的爸爸',
        entries: [
          { age: 28, year: 2015, message: '结婚了。她说愿意的时候，我觉得自己是世界上最幸运的人。', date: '2024年1月' },
          { age: 30, year: 2017, message: '女儿出生了。抱着她的时候，手都在抖。那么小的一团，眼睛闭着，嘴巴微微张着。我想，这辈子有了要守护的东西。', date: '2024年2月' },
          { age: 33, year: 2020, message: '三十而立。虽然还没有完全立起来，但至少知道自己要什么了。', date: '2024年3月' },
          { age: 35, year: 2022, message: '儿子出生了。现在是儿女双全了。累并快乐着。', date: '2024年3月' }
        ]
      },
      '李阿姨': {
        bio: '退休教师，喜欢种花',
        entries: [
          { age: 55, year: 2015, message: '退休了。忙碌了一辈子，终于可以停下来看看风景。', date: '2024年1月' },
          { age: 58, year: 2018, message: '开始学画画。没想到这个年纪还能发现新的爱好。', date: '2024年2月' },
          { age: 60, year: 2020, message: '花开了。种了三年的兰花终于开了。等待是值得的。', date: '2024年3月' },
          { age: 63, year: 2023, message: '孙子会叫奶奶了。心都化了。', date: '2024年3月' }
        ]
      },
      '小陈': {
        bio: '大学生，正在寻找自己',
        entries: [
          { age: 18, year: 2022, message: '终于上了大学。离开家的那天，妈妈在车站哭得比我还厉害。我说我会照顾好自己的，但其实心里慌得很。', date: '2024年1月' },
          { age: 20, year: 2024, message: '二十岁了。还不确定未来要做什么，但至少开始想了。', date: '2024年4月' }
        ]
      },
      '张叔': {
        bio: '出租车司机，见过凌晨的城市',
        entries: [
          { age: 35, year: 2010, message: '买了第一辆出租车。从此以后，凌晨一二三四五点的城市，我都见过了。', date: '2024年1月' },
          { age: 40, year: 2015, message: '开了五年车，载过几万人。有人上车就哭，有人在后座打电话说分手，有人喝醉了抱着方向盘不松手。每个人都有自己的故事。', date: '2024年2月' },
          { age: 45, year: 2020, message: '疫情的时候没车坐，在家待了三个月。第一次觉得，原来不工作这么难熬。', date: '2024年3月' },
          { age: 48, year: 2023, message: '女儿考上大学了。十二年接送，值了。', date: '2024年3月' }
        ]
      }
    };

    const stories = [];
    Object.entries(users).forEach(([username, userData]) => {
      userData.entries.forEach(entry => {
        stories.push({ ...entry, user: username });
      });
    });

    let currentStory = 0;
    let currentStoryUser = '';
    let currentDraft = null;

    function renderStory(index) {
      const story = stories[index];
      currentStoryUser = story.user;
      document.getElementById('storyAge').textContent = story.age + '岁 · ' + story.year;
      document.getElementById('storyMessage').textContent = story.message;
      document.getElementById('storyUser').textContent = story.user;
      document.getElementById('storyAvatar').textContent = story.user.charAt(0);
      document.getElementById('storyDate').textContent = story.date;
      document.getElementById('storyCounter').textContent = (index + 1) + ' / ' + stories.length;
      renderPageIndicator(index);
    }

    function renderPageIndicator(activeIndex) {
      const container = document.getElementById('pageIndicator');
      const maxDots = Math.min(stories.length, 17);
      let html = '';
      for (let i = 0; i < maxDots; i++) {
        html += '<div class="page-dot' + (i === activeIndex ? ' active' : '') + '" onclick="goToStory(' + i + ')"></div>';
      }
      container.innerHTML = html;
    }

    function goToStory(index) {
      currentStory = index;
      renderStory(currentStory);
    }

    function nextStory() {
      currentStory = (currentStory + 1) % stories.length;
      renderStory(currentStory);
    }

    function prevStory() {
      currentStory = (currentStory - 1 + stories.length) % stories.length;
      renderStory(currentStory);
    }

    function showProfile(username) {
      const user = users[username];
      if (!user) return;

      document.getElementById('profileName').textContent = username;
      document.getElementById('profileAvatar').textContent = username.charAt(0);
      document.getElementById('profileBio').textContent = user.bio;

      var years = user.entries.length;
      var span = years > 0 ? (user.entries[years - 1].year - user.entries[0].year) : 0;
      document.getElementById('profileStatYears').textContent = years;
      document.getElementById('profileStatSpan').textContent = span + '年';

      var timeline = document.getElementById('profileTimeline');
      timeline.innerHTML = user.entries.map(function(entry) {
        return '<div class="timeline-item">' +
          '<div class="timeline-year">' + entry.year + '年</div>' +
          '<div class="timeline-age">' + entry.age + '岁</div>' +
          '<div class="timeline-message">' + entry.message + '</div>' +
        '</div>';
      }).join('');

      document.getElementById('profileView').classList.add('active');
    }

    function hideProfile() {
      document.getElementById('profileView').classList.remove('active');
    }

    function showYears() {
      document.getElementById('yearExplorer').classList.add('active');
      document.getElementById('yearStories').classList.remove('active');
      document.getElementById('yearGrid').style.display = '';
      renderYears();
    }

    function hideYears() {
      document.getElementById('yearExplorer').classList.remove('active');
    }

    function renderYears() {
      var grid = document.getElementById('yearGrid');
      var years = [];
      for (var y = 2024; y >= 2008; y--) years.push(y);

      grid.innerHTML = years.map(function(year) {
        var count = stories.filter(function(s) { return s.year === year; }).length;
        var cls = count > 0 ? 'year-card has-content' : 'year-card';
        var countHtml = count > 0 ? '<span class="count">' + count + ' 条记录</span>' : '';
        return '<div class="' + cls + '" onclick="showYearStories(' + year + ')">' + year + countHtml + '</div>';
      }).join('');
    }

    function showYearStories(year) {
      var filtered = stories.filter(function(s) { return s.year === year; });
      var container = document.getElementById('yearStories');

      if (filtered.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:var(--text-dim); padding:48px; font-family:var(--serif);">这一年还没有人留下痕迹</p>';
      } else {
        container.innerHTML = filtered.map(function(story) {
          return '<div class="year-story-card" onclick="showProfile(\'' + story.user.replace(/'/g, "\\'") + '\'); hideYears();">' +
            '<div class="year-story-user">' +
              '<div class="year-story-avatar">' + story.user.charAt(0) + '</div>' +
              '<span class="year-story-name">' + story.user + '</span>' +
              '<span class="year-story-age">' + story.age + '岁</span>' +
            '</div>' +
            '<div class="year-story-message">' + story.message + '</div>' +
          '</div>';
        }).join('');
      }

      container.classList.add('active');
      document.getElementById('yearGrid').style.display = 'none';
    }

    function showWrite() {
      document.getElementById('writeView').classList.add('active');
    }

    function hideWrite() {
      document.getElementById('writeView').classList.remove('active');
    }

    function previewWrite() {
      var age = document.getElementById('writeAge').value;
      var year = document.getElementById('writeYear').value;
      var message = document.getElementById('writeMessage').value;

      if (!age || !year || !message.trim()) {
        showToast('请填写完整信息');
        return;
      }

      currentDraft = { age: parseInt(age), year: parseInt(year), message: message.trim() };
      document.getElementById('previewAge').textContent = age + '岁 · ' + year;
      document.getElementById('previewMessage').textContent = message;

      document.getElementById('writeView').classList.remove('active');
      document.getElementById('previewView').classList.add('active');
    }

    function hidePreview() {
      document.getElementById('previewView').classList.remove('active');
      document.getElementById('writeView').classList.add('active');
    }

    function confirmPublish() {
      if (!currentDraft) return;

      var username = '我';
      if (!users[username]) {
        users[username] = { bio: '新用户', entries: [] };
      }
      users[username].entries.push({
        age: currentDraft.age,
        year: currentDraft.year,
        message: currentDraft.message,
        date: '刚刚'
      });

      stories.push({
        age: currentDraft.age,
        year: currentDraft.year,
        message: currentDraft.message,
        user: '我',
        date: '刚刚'
      });

      showToast('痕迹已留下，不可更改');
      hidePreview();

      document.getElementById('writeAge').value = '';
      document.getElementById('writeYear').value = '';
      document.getElementById('writeMessage').value = '';
      currentDraft = null;
    }

    function showSearch() {
      document.getElementById('searchView').classList.add('active');
      setTimeout(function() { document.getElementById('searchInput').focus(); }, 100);
    }

    function hideSearch() {
      document.getElementById('searchView').classList.remove('active');
      document.getElementById('searchInput').value = '';
      document.getElementById('searchResults').innerHTML = '';
    }

    function handleSearch() {
      var query = document.getElementById('searchInput').value.toLowerCase();
      var results = document.getElementById('searchResults');

      if (!query) {
        results.innerHTML = '';
        return;
      }

      var matched = Object.keys(users).filter(function(name) {
        return name.toLowerCase().indexOf(query) !== -1;
      });

      results.innerHTML = matched.map(function(username) {
        return '<div class="search-result-item" onclick="showProfile(\'' + username.replace(/'/g, "\\'") + '\'); hideSearch();">' +
          '<div class="story-avatar">' + username.charAt(0) + '</div>' +
          '<div>' +
            '<div class="search-result-name">' + username + '</div>' +
            '<div class="search-result-bio">' + users[username].bio + '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function showHome() {
      hideProfile();
      hideYears();
      hideWrite();
      hidePreview();
      hideSearch();
    }

    function showToast(msg) {
      var toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(function() { toast.remove(); }, 3000);
    }

    renderStory(0);

    document.addEventListener('keydown', function(e) {
      if (document.getElementById('writeView').classList.contains('active') ||
          document.getElementById('previewView').classList.contains('active') ||
          document.getElementById('searchView').classList.contains('active')) return;
      if (e.key === 'ArrowRight') nextStory();
      if (e.key === 'ArrowLeft') prevStory();
      if (e.key === 'Escape') showHome();
    });

    var touchStartX = 0;
    document.addEventListener('touchstart', function(e) {
      touchStartX = e.changedTouches[0].screenX;
    });
    document.addEventListener('touchend', function(e) {
      var diff = e.changedTouches[0].screenX - touchStartX;
      if (Math.abs(diff) < 60) return;
      if (document.getElementById('writeView').classList.contains('active') ||
          document.getElementById('previewView').classList.contains('active') ||
          document.getElementById('searchView').classList.contains('active') ||
          document.getElementById('profileView').classList.contains('active') ||
          document.getElementById('yearExplorer').classList.contains('active')) return;
      if (diff < 0) nextStory();
      else prevStory();
    });
  </script>
</body>
</html>
